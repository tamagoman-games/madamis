<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120f16">
  <title>オンライン・マーダーミステリー ― 深夜0時の館 / 消えた魔女の遺産</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23120f16' stroke='%23c8a55a' stroke-width='2'/%3E%3Cpath d='M16 7v9' stroke='%23c8a55a' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- 1. タイトル -->
  <section id="screen-title" class="screen">
    <div class="title-wrap">
      <svg class="clock" viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="92" class="clock-ring"/>
        <circle cx="100" cy="100" r="84" class="clock-ring thin"/>
        <g class="clock-ticks"></g>
        <line x1="100" y1="100" x2="100" y2="34" class="hand minute"/>
        <line x1="100" y1="100" x2="100" y2="54" class="hand hour"/>
        <circle cx="100" cy="100" r="5" class="clock-pin"/>
      </svg>
      <h1 class="game-title">マーダーミステリー</h1>
      <p class="game-sub">深夜0時の館 ／ 消えた魔女の遺産<br>3〜5人（4人推奨） ／ 約30分 ／ GMなし</p>
    </div>
    <div class="stack">
      <button class="btn primary big" id="title-create">部屋を作る</button>
      <button class="btn big" id="title-join">部屋コードで参加する</button>
      <button class="link" id="title-howto">遊び方</button>
    </div>
  </section>

  <!-- 2. 部屋作成 / 参加 -->
  <section id="screen-entry" class="screen" hidden>
    <header class="bar"><button class="back" id="entry-back" aria-label="戻る">‹</button><h2 id="entry-title">部屋を作る</h2><span></span></header>
    <div class="pad stack">
      <label class="field">
        <span>あなたの名前（12文字まで）</span>
        <input id="entry-name" maxlength="12" autocomplete="nickname" placeholder="例：アキ">
      </label>
      <label class="field" id="entry-code-wrap" hidden>
        <span>部屋コード（6文字）</span>
        <input id="entry-code" maxlength="6" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="例：A7K29P" class="code-input">
      </label>
      <button class="btn primary big" id="entry-go">部屋を作る</button>
      <p class="hint" id="entry-hint">ホストになります。部屋コードを友達に伝えてください。</p>
    </div>
  </section>

  <!-- 3. ロビー -->
  <section id="screen-lobby" class="screen" hidden>
    <header class="bar"><button class="back" id="lobby-leave" aria-label="退出">‹</button><h2>ロビー</h2><span class="net" id="lobby-net"></span></header>
    <div class="scroll pad stack">
      <div class="card center">
        <div class="muted small">部屋コード</div>
        <div class="room-code" id="lobby-code">------</div>
        <div class="row gap center">
          <button class="btn small" id="lobby-copy">コードをコピー</button>
          <button class="btn small" id="lobby-share">URLを共有</button>
        </div>
      </div>
      <div class="card" id="lobby-scenario-card">
        <h3>シナリオ</h3>
        <div class="stack" id="scenario-list"></div>
        <p class="hint" id="scenario-hint"></p>
      </div>
      <div class="card">
        <div class="row between"><h3>参加者</h3><span class="muted" id="lobby-count"></span></div>
        <ul class="players" id="lobby-players"></ul>
      </div>
      <details class="card" id="lobby-settings">
        <summary>制限時間の設定（分）</summary>
        <div class="settings-grid" id="settings-grid"></div>
        <p class="hint" id="settings-hint"></p>
      </details>
      <p class="hint" id="lobby-hint"></p>
    </div>
    <footer class="foot">
      <button class="btn primary big" id="lobby-main"></button>
    </footer>
  </section>

  <!-- 4. ゲーム -->
  <section id="screen-game" class="screen" hidden>
    <header class="game-head">
      <div class="row between">
        <div class="phase-name" id="g-phase">-</div>
        <div class="row gap">
          <div class="timer" id="g-timer">0:00</div>
          <button class="icon" id="g-menu" aria-label="メニュー">⋯</button>
        </div>
      </div>
      <div class="progress"><i id="g-progress"></i></div>
    </header>
    <div class="sc-alert" id="sc-alert" hidden></div>
    <main class="views">
      <div class="view scroll" id="view-main"></div>
      <div class="view scroll" id="view-sheet" hidden></div>
      <div class="view scroll" id="view-board" hidden></div>
      <div class="view scroll" id="view-secret" hidden></div>
      <div class="view chat" id="view-chat" hidden>
        <ul id="chat-list" class="chat-list"></ul>
        <form id="chat-form" class="chat-form" autocomplete="off">
          <input id="chat-input" maxlength="300" placeholder="メッセージを入力" enterkeyhint="send" autocomplete="off">
          <button class="btn primary" type="submit">送信</button>
        </form>
      </div>
    </main>
    <nav class="tabs" id="g-tabs">
      <button data-tab="main"><b>進行</b></button>
      <button data-tab="sheet"><b>資料</b></button>
      <button data-tab="board"><b>証拠</b><i class="badge" id="badge-board" hidden>0</i></button>
      <button data-tab="chat"><b>全体</b><i class="badge" id="badge-chat" hidden>0</i></button>
      <button data-tab="secret"><b>密談</b><i class="badge" id="badge-secret" hidden>0</i></button>
    </nav>
  </section>
</div>

<div id="banner" class="banner" hidden>再接続しています…</div>
<div id="toast" class="toast" hidden></div>
<div id="modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <div id="modal-body"></div>
    <div class="row gap modal-actions" id="modal-actions"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
